<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://bpwxxodhiswltefhqbol.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwd3h4b2RoaXN3bHRlZmhxYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzc3NjQsImV4cCI6MjEwNjYxMzc2NH0.tVs4JpCyJFAcakyIHMCV49xiuzNgNr2SeG1S5iUeF48';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let preguntas = [];
    let indiceActual = 0;
    let respuestasGuardadas = {};
    let alumnoActual = null;
    let codTp = '';
    let respVFActuales = {};

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        codTp = urlParams.get('tp') || 'CBMTP-1-MAT-001';

        document.getElementById('codigoTP').innerText = codTp;

        const sesionLocal = localStorage.getItem('alumnoSesion');
        alumnoActual = sesionLocal ? JSON.parse(sesionLocal) : null;

        if (alumnoActual) {
            await armarEncabezadoCompleto(alumnoActual);
        } else {
            document.getElementById('subtituloTP').innerText = 'Estudiante: - | Curso: -';
        }

        await cargarPreguntasSupabase();
    });

    async function armarEncabezadoCompleto(alumno) {
        let nombreAlumno = alumno.nombre ? `${alumno.apellido || ''} ${alumno.nombre}`.trim() : 'Estudiante';
        let escuelaNombre = 'S/E';
        let cursoNombre = 'General';

        try {
            if (alumno.curso_id) {
                const { data: curso } = await supabaseClient
                    .from('cursos')
                    .select('*')
                    .eq('id', alumno.curso_id)
                    .single();

                if (curso) {
                    if (curso.institucion && curso.institucion !== 'S/E') escuelaNombre = curso.institucion;
                    if (curso.anio_division) cursoNombre = curso.anio_division;
                }
            } else if (alumno.cursos) {
                if (alumno.cursos.institucion && alumno.cursos.institucion !== 'S/E') escuelaNombre = alumno.cursos.institucion;
                if (alumno.cursos.anio_division) cursoNombre = alumno.cursos.anio_division;
            }
        } catch (err) {
            console.error('Error al obtener datos del curso:', err);
        }

        const textoEscuela = (escuelaNombre !== 'S/E') ? `Escuela: ${escuelaNombre} - ` : '';
        document.getElementById('subtituloTP').innerText = `Estudiante: ${nombreAlumno} | ${textoEscuela}Curso: ${cursoNombre}`;
    }

    async function cargarPreguntasSupabase() {
        try {
            const { data, error } = await supabaseClient
                .from('banco_preguntas')
                .select('*')
                .eq('cod_tp', codTp)
                .order('N_de_orden_pregunta', { ascending: true });

            if (error) throw error;

            if (!data || data.length === 0) {
                document.getElementById('textoConsigna').innerText = 'No hay preguntas disponibles para este TP.';
                return;
            }

            preguntas = data;
            if (preguntas[0].materia) {
                document.getElementById('tituloTP').innerText = preguntas[0].materia;
            } else {
                document.getElementById('tituloTP').innerText = 'Trabajo Práctico';
            }

            mostrarPregunta(0);

        } catch (err) {
            alert('Error al obtener preguntas: ' + err.message);
        }
    }

    function mostrarPregunta(index) {
        if (index >= preguntas.length) {
            guardarResultadoFinal();
            return;
        }

        const p = preguntas[index];
        document.getElementById('contadorTexto').innerText = `Pregunta ${index + 1} de ${preguntas.length}`;
        document.getElementById('textoConsigna').innerHTML = p.consigna || '';

        const select = document.getElementById('selectRespuesta');
        
        let contenedorTabla = document.getElementById('contenedorTablaVF');
        if (contenedorTabla) contenedorTabla.remove();

        // Detección flexible de Matriz / VF respetando triple coma (,,,) o :::
        const tipoPreg = String(p.tipo || p.tipo_pregunta || '').toUpperCase();
        const opcionesStr = typeof p.opciones === 'string' ? p.opciones : JSON.stringify(p.opciones || '');
        const esTablaVF = tipoPreg === 'VF' || 
                          tipoPreg === 'MATRIZ_VF' || 
                          opcionesStr.includes(',,,') || 
                          opcionesStr.includes(':::');

        if (esTablaVF) {
            select.classList.add('hidden');
            respVFActuales = {};

            let filas = [];
            if (Array.isArray(p.opciones)) {
                filas = p.opciones;
            } else if (typeof p.opciones === 'string') {
                filas = p.opciones.includes(',,,') ? p.opciones.split(',,,') : p.opciones.split(':::');
            }

            const tablaDiv = document.createElement('div');
            tablaDiv.id = 'contenedorTablaVF';
            
            let htmlTabla = `
                <table class="tabla-vf">
                    <thead>
                        <tr>
                            <th>Concepto</th>
                            <th style="width: 60px;">V</th>
                            <th style="width: 60px;">F</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filas.forEach((filaTexto, fIdx) => {
                const itemLimpio = String(filaTexto).trim();
                if (itemLimpio) {
                    htmlTabla += `
                        <tr>
                            <td>${itemLimpio}</td>
                            <td>
                                <button type="button" class="btn-vf-opcion btn-v-${fIdx}" onclick="seleccionarOpcionVF(${fIdx}, 'V', ${filas.length})">V</button>
                            </td>
                            <td>
                                <button type="button" class="btn-vf-opcion btn-f-${fIdx}" onclick="seleccionarOpcionVF(${fIdx}, 'F', ${filas.length})">F</button>
                            </td>
                        </tr>
                    `;
                }
            });

            htmlTabla += `</tbody></table>`;
            tablaDiv.innerHTML = htmlTabla;
            document.querySelector('.box-pregunta').appendChild(tablaDiv);

            if (respuestasGuardadas[p.id]) {
                try {
                    const estado = JSON.parse(respuestasGuardadas[p.id]);
                    Object.keys(estado).forEach(fIdx => {
                        seleccionarOpcionVF(parseInt(fIdx), estado[fIdx], filas.length);
                    });
                } catch (e) {}
            } else {
                habilitarBoton(false);
            }

        } else {
            select.classList.remove('hidden');
            select.innerHTML = '<option value="">-- Selecciona una opción --</option>';

            if (p.opciones) {
                let listaOp = [];
                if (Array.isArray(p.opciones)) {
                    listaOp = p.opciones;
                } else if (typeof p.opciones === 'string') {
                    listaOp = p.opciones.includes(',,,') ? p.opciones.split(',,,') : p.opciones.split(',');
                }

                listaOp.forEach(op => {
                    const optText = String(op).trim();
                    if (optText) {
                        const optionEl = document.createElement('option');
                        optionEl.value = optText;
                        optionEl.textContent = optText;
                        select.appendChild(optionEl);
                    }
                });
            }

            if (respuestasGuardadas[p.id]) {
                select.value = respuestasGuardadas[p.id];
                habilitarBoton(true);
            } else {
                habilitarBoton(false);
            }
        }

        const btn = document.getElementById('btnNavegacion');
        btn.innerText = (index === preguntas.length - 1) ? 'FINALIZAR Y ENVIAR' : 'SIGUIENTE';

        if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise();
        }
    }

    function seleccionarOpcionVF(filaIndex, valor, totalFilas) {
        const btnV = document.querySelector(`.btn-v-${filaIndex}`);
        const btnF = document.querySelector(`.btn-f-${filaIndex}`);

        if (valor === 'V') {
            btnV.classList.add('seleccionado-v');
            btnF.classList.remove('seleccionado-f');
        } else {
            btnF.classList.add('seleccionado-f');
            btnV.classList.remove('seleccionado-v');
        }

        respVFActuales[filaIndex] = valor;

        const pActual = preguntas[indiceActual];
        respuestasGuardadas[pActual.id] = JSON.stringify(respVFActuales);

        if (Object.keys(respVFActuales).length === totalFilas) {
            habilitarBoton(true);
        }
    }

    const selectEl = document.getElementById('selectRespuesta');
    const btnNav = document.getElementById('btnNavegacion');

    selectEl.addEventListener('change', () => {
        const haySeleccion = selectEl.value !== '';
        habilitarBoton(haySeleccion);
    });

    function habilitarBoton(activar) {
        if (activar) {
            btnNav.removeAttribute('disabled');
            btnNav.classList.add('activo');
        } else {
            btnNav.setAttribute('disabled', 'true');
            btnNav.classList.remove('activo');
        }
    }

    btnNav.addEventListener('click', async () => {
        const pActual = preguntas[indiceActual];
        
        const tipoPreg = String(pActual.tipo || pActual.tipo_pregunta || '').toUpperCase();
        const opcionesStr = typeof pActual.opciones === 'string' ? pActual.opciones : JSON.stringify(pActual.opciones || '');
        const esTablaVF = tipoPreg === 'VF' || 
                          tipoPreg === 'MATRIZ_VF' || 
                          opcionesStr.includes(',,,') || 
                          opcionesStr.includes(':::');
        
        if (!esTablaVF) {
            respuestasGuardadas[pActual.id] = selectEl.value;
        }

        indiceActual++;
        if (indiceActual < preguntas.length) {
            mostrarPregunta(indiceActual);
        } else {
            await guardarResultadoFinal();
        }
    });

    async function guardarResultadoFinal() {
        try {
            let aciertos = 0;
            const totalPreguntas = preguntas.length;

            const payloadRespuestas = preguntas.map(p => {
                const respAlumno = respuestasGuardadas[p.id] || '';
                const respCorrecta = p.respuesta_correcta || '';
                let esCorrecta = false;

                const tipoPreg = String(p.tipo || p.tipo_pregunta || '').toUpperCase();
                const opcionesStr = typeof p.opciones === 'string' ? p.opciones : JSON.stringify(p.opciones || '');
                const esTablaVF = tipoPreg === 'VF' || 
                                  tipoPreg === 'MATRIZ_VF' || 
                                  opcionesStr.includes(',,,') || 
                                  opcionesStr.includes(':::');

                if (esTablaVF) {
                    esCorrecta = respAlumno.trim().toLowerCase() === respCorrecta.trim().toLowerCase();
                } else {
                    esCorrecta = respAlumno.trim().toLowerCase() === respCorrecta.trim().toLowerCase();
                }

                if (esCorrecta) aciertos++;

                return {
                    pregunta_id: p.id,
                    respuesta: respAlumno,
                    correcta: respCorrecta,
                    es_correcta: esCorrecta
                };
            });

            const notaCalculada = Math.round((aciertos / totalPreguntas) * 10);
            const aprobado = notaCalculada >= 6;

            const { error } = await supabaseClient
                .from('evaluaciones_resultados')
                .insert([{
                    alumno_id: alumnoActual ? alumnoActual.id : null,
                    curso_id: alumnoActual ? alumnoActual.curso_id : null,
                    tp_codigo: codTp,
                    nota: notaCalculada,
                    nivel_bloom: 'Evaluación',
                    tiempo_segundos: 0,
                    foco_perdido: 0,
                    detalle_respuestas: payloadRespuestas
                }]);

            if (error) throw error;

            finalizarTP(notaCalculada, aciertos, totalPreguntas, aprobado);

        } catch (err) {
            console.error('Error al guardar:', err);
            alert('Error al registrar tu entrega: ' + err.message);
        }
    }

    function finalizarTP(nota, aciertos, total, aprobado) {
        document.getElementById('secPregunta').classList.add('hidden');
        const secFin = document.getElementById('secFin');
        secFin.classList.remove('hidden');

        if (aprobado) {
            secFin.innerHTML = `
                <div style="font-size: 3rem; margin-bottom: 10px;">🎉</div>
                <h2 style="color: #16a34a; font-size: 1.8rem; margin-bottom: 8px;">¡Felicitaciones! Aprobaste el TP</h2>
                <div style="font-size: 2.2rem; font-weight: 800; color: #16a34a; margin: 15px 0;">Nota: ${nota} / 10</div>
                <p style="color: #475569; margin-bottom: 25px;">Respondiste correctamente ${aciertos} de ${total} preguntas. Tu resultado ha sido registrado con éxito.</p>
                <button class="btn-siguiente activo" onclick="window.location.href='alumno.html'">VOLVER AL PORTAL</button>
            `;
        } else {
            secFin.innerHTML = `
                <div style="font-size: 3rem; margin-bottom: 10px;">💪</div>
                <h2 style="color: #ea580c; font-size: 1.8rem; margin-bottom: 8px;">Debes rehacer la evaluación</h2>
                <div style="font-size: 2.2rem; font-weight: 800; color: #ea580c; margin: 15px 0;">Nota: ${nota} / 10</div>
                <p style="color: #475569; margin-bottom: 20px;">Respondiste correctamente ${aciertos} de ${total} preguntas. Necesitás al menos 6/10 para aprobar.</p>
                <button class="btn-siguiente activo" style="margin-bottom: 15px;" onclick="window.location.reload()">REHACER EVALUACIÓN</button>
                <br>
                <a href="alumno.html" style="color: #64748b; text-decoration: underline; font-size: 0.9rem;">Volver al Portal del Alumno</a>
            `;
        }
    }
</script>
