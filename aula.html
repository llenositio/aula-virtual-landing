<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual - Evaluación</title>
    <!-- Estilos base de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Configuración e inclusión de MathJax para formulas LaTeX -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        
        .card-evaluacion { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); 
            border: 1px solid #edf2f7; 
            margin-bottom: 20px; 
        }
        
        .hidden { display: none !important; }

        /* Estilo idéntico a la tabla azul original de Apps Script */
        .tabla-vf { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            margin-top: 15px; 
            border: 1px solid #3b82f6; 
            border-radius: 8px;
            overflow: hidden;
        }
        
        .tabla-vf th { 
            background-color: #3b82f6; 
            color: #ffffff; 
            padding: 14px 10px; 
            font-weight: 700; 
            text-align: center; 
            font-size: 0.95rem;
            border-bottom: 1px solid #3b82f6;
        }
        
        .tabla-vf td { 
            padding: 12px 16px; 
            border-bottom: 1px solid #e2e8f0; 
            border-right: 1px solid #edf2f7;
            vertical-align: middle; 
            background-color: #ffffff;
        }

        .tabla-vf tr:last-child td { border-bottom: none; }
        .tabla-vf td:last-child { border-right: none; }
        .tabla-vf td.col-concepto { text-align: left; }
        .tabla-vf td.col-opcion { text-align: center; width: 60px; }
        
        .btn-vf-opcion { 
            width: 38px; 
            height: 38px; 
            border-radius: 6px; 
            border: 1px solid #cbd5e1; 
            background: #ffffff; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.15s ease-in-out; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        
        .btn-vf-opcion:hover { border-color: #3b82f6; color: #3b82f6; }
        .seleccionado-v { background-color: #2563eb !important; color: #ffffff !important; border-color: #2563eb !important; }
        .seleccionado-f { background-color: #dc2626 !important; color: #ffffff !important; border-color: #dc2626 !important; }
        
        .btn-siguiente { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: none; 
            background-color: #94a3b8; 
            color: #ffffff; 
            font-weight: 700; 
            font-size: 0.95rem;
            letter-spacing: 0.5px; 
            transition: background-color 0.2s;
        }
        
        .btn-siguiente.activo { background-color: #3b82f6; cursor: pointer; }
        .btn-siguiente.activo:hover { background-color: #2563eb; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 720px;">
    
    <!-- Encabezado de la Evaluación -->
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary mb-1" id="tituloTP">Cargando Evaluación...</h2>
        <p class="text-secondary small mb-0" id="subtituloTP">Escuela: - | Curso: -</p>
    </div>

    <!-- Contador de Pregunta -->
    <div class="mb-2 ms-1">
        <span class="text-secondary fw-semibold small" id="contadorTexto">Pregunta 1 de 1</span>
    </div>

    <!-- Contenedor Principal renderizado por Especialistas -->
    <div id="secPregunta">
        <div class="card-evaluacion" id="contenedorRenderEspecialista">
            <div class="text-center text-muted">Cargando consigna...</div>
        </div>

        <button id="btnNavegacion" class="btn-siguiente" disabled>FINALIZAR Y ENVIAR</button>
    </div>

    <div id="secFin" class="card-evaluacion text-center hidden py-5"></div>
</div>

<!-- Librería de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Modulos de Especialistas -->
<script src="js/especialista_om.js"></script>
<script src="js/especialista_vf.js"></script>

<!-- Script Director de la Evaluación -->
<script>
    const SUPABASE_URL = 'https://bpwxxodhiswltefhqbol.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwd3h4b2RoaXN3bHRlZmhxYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMzc3NjQsImV4cCI6MjEwNjYxMzc2NH0.tVs4JpCyJFAcakyIHMCV49xiuzNgNr2SeG1S5iUeF48';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const Director = {
        preguntas: [],
        indiceActual: 0,
        respuestasGuardadas: {},
        puntosObtenidos: {},
        alumnoActual: null,
        codTp: '',
        especialistaActual: null,

        async iniciar() {
            const urlParams = new URLSearchParams(window.location.search);
            this.codTp = urlParams.get('tp') || '';

            const sesionLocal = localStorage.getItem('alumnoSesion');
            this.alumnoActual = sesionLocal ? JSON.parse(sesionLocal) : null;

            if (this.alumnoActual) {
                await this.armarEncabezado(this.alumnoActual);
            }

            await this.cargarPreguntas();
        },

       async armarEncabezado(alumno) {
            let escuelaNombre = 'S/E';
            let cursoNombre = 'General';

            try {
                if (alumno.curso_id) {
                    const { data: curso } = await supabaseClient
                        .from('cursos')
                        .select('*')
                        .eq('id', alumno.curso_id)
                        .maybeSingle();

                    if (curso) {
                        if (curso.escuela || curso.institucion) escuelaNombre = curso.escuela || curso.institucion;
                        if (curso.anio_division) cursoNombre = curso.anio_division;
                    }
                }
            } catch (err) {
                console.error('Error al obtener datos del curso:', err);
            }

            const elemSub = document.getElementById('subtituloTP');
            if (elemSub) elemSub.innerText = `Escuela: ${escuelaNombre} - Curso: ${cursoNombre}`;

            // Inserción del banner del logo
            const elemTitulo = document.getElementById('tituloTP');
            if (elemTitulo && !document.getElementById('bannerLogo')) {
                const imgBanner = document.createElement('img');
                imgBanner.id = 'bannerLogo';
                imgBanner.src = 'banner.png';
                imgBanner.className = 'img-fluid mb-3';
                imgBanner.style.maxWidth = '100%';
                imgBanner.style.borderRadius = '8px';
                elemTitulo.parentNode.insertBefore(imgBanner, elemTitulo);
            }
        },

        async cargarPreguntas() {
            try {
                if (!this.codTp) {
                    document.getElementById('contenedorRenderEspecialista').innerHTML = 
                        '<div class="alert alert-warning text-center">No se especificó ningún código de TP en la URL.</div>';
                    return;
                }

                // Consulta limpia a banco_preguntas con coincidencia flexible
                let { data, error } = await supabaseClient
                    .from('banco_preguntas')
                    .select('*')
                    .ilike('cod_tp', this.codTp)
                    .order('N_de_orden_pregunta', { ascending: true });

                if (error) throw error;

                if (!data || data.length === 0) {
                    document.getElementById('contenedorRenderEspecialista').innerHTML = 
                        `<div class="alert alert-danger text-center">No hay preguntas cargadas para el TP [${this.codTp}].</div>`;
                    return;
                }

                this.preguntas = data;
                const elemTitulo = document.getElementById('tituloTP');
                if (elemTitulo) {
                    elemTitulo.innerText = this.preguntas[0].titulo_humano || this.preguntas[0].materia || `TP Nº ${this.codTp}`;
                }

                this.mostrarPregunta(0);

            } catch (err) {
                console.error('Error al cargar preguntas:', err);
                document.getElementById('contenedorRenderEspecialista').innerHTML = 
                    `<div class="alert alert-danger text-center">Error al consultar el TP: ${err.message}</div>`;
            }
        },
        mostrarPregunta(index) {
            if (index >= this.preguntas.length) {
                this.guardarResultadoFinal();
                return;
            }

            this.indiceActual = index;
            const pRaw = this.preguntas[index];

            document.getElementById('contadorTexto').innerText = `Pregunta ${index + 1} de ${this.preguntas.length}`;

            // Determinar tipo de pregunta
            const tipoPreg = String(pRaw.tipo || pRaw.tipo_pregunta || '').toUpperCase();
            const opcionesStr = typeof pRaw.opciones === 'string' ? pRaw.opciones : JSON.stringify(pRaw.opciones || '');
            const esVF = tipoPreg === 'VF' || tipoPreg === 'MATRIZ_VF' || opcionesStr.includes(',,,');

            // Delegar al especialista correspondiente
            if (esVF && window.EspecialistaVF) {
                this.especialistaActual = window.EspecialistaVF;
            } else {
                this.especialistaActual = window.EspecialistaOM;
            }

            const pNormalizada = this.especialistaActual.normalizar(pRaw);
            const respGuardada = this.respuestasGuardadas[pNormalizada.id] || null;

            const html = this.especialistaActual.render(pNormalizada, respGuardada);
            document.getElementById('contenedorRenderEspecialista').innerHTML = html;

            // Actualizar texto del botón de navegación
            const btn = document.getElementById('btnNavegacion');
            if (btn) {
                btn.innerText = (index === this.preguntas.length - 1) ? 'FINALIZAR Y ENVIAR' : 'SIGUIENTE';
            }

            this.habilitarBotonNavegacion(respGuardada !== null && respGuardada !== '');

            // Re-procesar MathJax para renderizar fórmulas en el nuevo HTML
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        },

        habilitarBotonNavegacion(activar) {
            const btn = document.getElementById('btnNavegacion');
            if (!btn) return;

            if (activar) {
                btn.removeAttribute('disabled');
                btn.classList.add('activo');
            } else {
                btn.setAttribute('disabled', 'true');
                btn.classList.remove('activo');
            }
        },

        procesarSiguiente() {
            const pRaw = this.preguntas[this.indiceActual];
            const pNormalizada = this.especialistaActual.normalizar(pRaw);

            const respuestaAlumno = this.especialistaActual.obtenerRespuesta();
            this.respuestasGuardadas[pNormalizada.id] = respuestaAlumno;

            // Calcular puntaje del ejercicio
            let puntaje = 0;
            if (pRaw.tipo === 'VF' || String(pRaw.opciones).includes(',,,')) {
                puntaje = this.especialistaActual.calcularPuntaje(respuestaAlumno, pNormalizada.subPreguntas);
            } else {
                puntaje = this.especialistaActual.calcularPuntaje(respuestaAlumno, pNormalizada.correcta);
            }

            this.puntosObtenidos[pNormalizada.id] = puntaje;

            this.indiceActual++;
            if (this.indiceActual < this.preguntas.length) {
                this.mostrarPregunta(this.indiceActual);
            } else {
                this.guardarResultadoFinal();
            }
        },

        async guardarResultadoFinal() {
            try {
                let sumaPuntos = 0;
                const totalPreguntas = this.preguntas.length;

                const payloadRespuestas = this.preguntas.map(pRaw => {
                    const pNorm = (pRaw.tipo === 'VF' || String(pRaw.opciones).includes(',,,')) 
                        ? window.EspecialistaVF.normalizar(pRaw) 
                        : window.EspecialistaOM.normalizar(pRaw);

                    const respAlumno = this.respuestasGuardadas[pNorm.id] || '';
                    const pt = this.puntosObtenidos[pNorm.id] || 0;
                    sumaPuntos += pt;

                    return {
                        pregunta_id: pNorm.id,
                        respuesta: respAlumno,
                        correcta: pNorm.correcta || pNorm.subPreguntas,
                        es_correcta: pt >= 0.8
                    };
                });

                const notaCalculada = Math.round((sumaPuntos / totalPreguntas) * 10);
                const aprobado = notaCalculada >= 6;

                const { error } = await supabaseClient
                    .from('evaluaciones_resultados')
                    .insert([{
                        alumno_id: this.alumnoActual ? this.alumnoActual.id : null,
                        curso_id: this.alumnoActual ? this.alumnoActual.curso_id : null,
                        tp_codigo: this.codTp,
                        nota: notaCalculada,
                        nivel_bloom: 'Evaluación',
                        tiempo_segundos: 0,
                        foco_perdido: 0,
                        detalle_respuestas: payloadRespuestas
                    }]);

                if (error) throw error;

                this.finalizarTP(notaCalculada, sumaPuntos, totalPreguntas, aprobado);

            } catch (err) {
                console.error('Error al guardar:', err);
                alert('Error al registrar tu entrega: ' + err.message);
            }
        },

        finalizarTP(nota, sumaPuntos, total, aprobado) {
            document.getElementById('secPregunta')?.classList.add('hidden');
            const secFin = document.getElementById('secFin');
            if (!secFin) return;
            secFin.classList.remove('hidden');

            if (aprobado) {
                secFin.innerHTML = `
                    <div style="font-size: 3rem; margin-bottom: 10px;">🎉</div>
                    <h2 style="color: #16a34a; font-size: 1.8rem; margin-bottom: 8px;">¡Felicitaciones! Aprobaste el TP</h2>
                    <div style="font-size: 2.2rem; font-weight: 800; color: #16a34a; margin: 15px 0;">Nota: ${nota} / 10</div>
                    <p style="color: #475569; margin-bottom: 25px;">Tu resultado ha sido registrado con éxito.</p>
                    <button class="btn-siguiente activo" onclick="window.location.href='alumno.html'">VOLVER AL PORTAL</button>
                `;
            } else {
                secFin.innerHTML = `
                    <div style="font-size: 3rem; margin-bottom: 10px;">💪</div>
                    <h2 style="color: #ea580c; font-size: 1.8rem; margin-bottom: 8px;">Debes rehacer la evaluación</h2>
                    <div style="font-size: 2.2rem; font-weight: 800; color: #ea580c; margin: 15px 0;">Nota: ${nota} / 10</div>
                    <p style="color: #475569; margin-bottom: 20px;">Necesitás al menos 6/10 para aprobar.</p>
                    <button class="btn-siguiente activo" style="margin-bottom: 15px;" onclick="window.location.reload()">REHACER EVALUACIÓN</button>
                    <br>
                    <a href="alumno.html" style="color: #64748b; text-decoration: underline; font-size: 0.9rem;">Volver al Portal del Alumno</a>
                `;
            }
        }
    };

    window.Director = Director;

    document.addEventListener('DOMContentLoaded', () => {
        Director.iniciar();

        document.getElementById('btnNavegacion')?.addEventListener('click', () => {
            Director.procesarSiguiente();
        });
    });
</script>
</body>
</html>
