<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual - Panel del Profesor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-custom { border-radius: 12px; }
    </style>
</head>
<body>

    <!-- NAVBAR TOP -->
    <nav class="navbar navbar-dark bg-dark px-4 shadow-sm mb-4">
        <span class="navbar-brand fw-bold fs-4">Aula Virtual | Panel Docente</span>
        <button id="btnCerrarSesion" class="btn btn-outline-light btn-sm d-none">Cerrar Sesión</button>
    </nav>

    <div class="container pb-5">

        <!-- SECCIÓN 1: LOGIN / REGISTRO -->
        <div id="seccionAuth" class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom p-4 shadow border-0">
                    <h3 id="authTitulo" class="fw-bold mb-3 text-center">Iniciar Sesión</h3>
                    
                    <!-- BOTÓN GOOGLE OAUTH -->
                    <button id="btnGoogleAuth" type="button" class="btn btn-outline-danger w-100 mb-3 d-flex align-items-center justify-content-center gap-2 fw-bold">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                        </svg>
                        Ingresar con Google
                    </button>

                    <div id="separadorAuth" class="text-center text-muted small my-2">O con tu correo y contraseña</div>

                    <form id="formAuth">
                        <div id="camposRegistro" class="d-none">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" id="authNombre" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Apellido</label>
                                <input type="text" id="authApellido" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" id="authEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña</label>
                            <input type="password" id="authPassword" class="form-control" required>
                        </div>
                        <button type="submit" id="btnAuthSubmit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Ingresar</button>
                        <div class="text-center">
                            <a href="#" id="toggleAuthMode" class="small text-decoration-none">¿No tenés cuenta? Registrate acá</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: MIS CURSOS (DASHBOARD) -->
        <div id="seccionDashboard" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">Mis Cursos</h2>
                <button class="btn btn-success fw-bold px-3 py-2" data-bs-toggle="modal" data-bs-target="#modalCrearCurso">+ Crear Nuevo Curso</button>
            </div>

            <!-- GRILLA DE CURSOS -->
            <div id="contenedorCursos" class="row">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>

        <!-- SECCIÓN 3: DETALLE DEL CURSO Y ALUMNOS -->
        <div id="seccionDetalleCurso" class="d-none">
            <div class="mb-4">
                <button id="btnVolverCursos" class="btn btn-outline-secondary btn-sm mb-3">&larr; Volver a Mis Cursos</button>
                <h2 id="detalleTituloCurso" class="fw-bold mb-1">Detalle del Curso</h2>
                <p id="detalleSubtituloCurso" class="text-muted mb-0"></p>
            </div>

            <!-- TABLA DE ALUMNOS -->
            <div class="card card-custom p-4 border-0 shadow-sm">
                <h4 class="fw-bold mb-3">Nómina de Alumnos Inscriptos</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Apellido</th>
                                <th>Nombre</th>
                                <th>PIN / Acceso</th>
                            </tr>
                        </thead>
                        <tbody id="tablaAlumnosBody">
                            <!-- Se cargan dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL CREAR CURSO -->
    <div class="modal fade" id="modalCrearCurso" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content card-custom">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Crear Nuevo Curso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formCrearCurso">
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Institución / Escuela</label>
                                <input type="text" id="cursoInstitucion" class="form-control" placeholder="Ej: ET24DE17" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Año y División</label>
                                <input type="text" id="cursoAnioDivision" class="form-control" placeholder="Ej: 1° 1°" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Modalidad</label>
                                <input type="text" id="cursoModalidad" class="form-control" placeholder="Ej: CBMTP" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Carga Masiva de Alumnos (Pega la lista de Excel/Word)</label>
                            <small class="text-muted d-block mb-2">Formato: Un alumno por línea. Ejemplo: <code>PÉREZ, Juan</code> o <code>Perez Juan</code></small>
                            <textarea id="nominaRaw" class="form-control" rows="8" placeholder="ALVARADO BRACHO, Aaron Alexander&#10;ALVAREZ, Alejo Joaquin" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary fw-bold">Guardar Curso y Alumnos</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/panel.js"></script>
</body>
</html>
